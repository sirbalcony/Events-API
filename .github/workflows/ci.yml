name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker buildx build --load -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api-ci -p 5000:5000 events-api:latest

      - name: Wait for API health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:5000/api/health; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API (attempt $attempt/15)..."
            sleep 2
          done

          echo "API did not start successfully"
          docker logs events-api-ci
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Stop and remove container
        if: ${{ always() }}
        run: |
          docker stop events-api-ci || true
          docker rm events-api-ci || true