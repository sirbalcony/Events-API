name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker buildx build --load -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api-ci -p 5000:5000 events-api:latest

      - name: Check API health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://localhost:5000/api/health

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Stop and remove container
        if: ${{ always() }}
        run: |
          docker stop events-api-ci || true
          docker rm events-api-ci || true